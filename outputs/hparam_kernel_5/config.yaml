seed: 42
device: auto
data:
  data_dir: data
  batch_size: 256
  num_workers: 0
  pin_memory: true
model:
  nz: 100
  ngf: 64
  ndf: 64
  nc: 1
  num_classes: 10
  embed_dim: 32
  leaky_relu_slope: 0.2
  extra_layers: 1
  kernel_size: 5
training:
  epochs: 5
  lr_g: 0.0002
  lr_d: 0.0002
  beta1: 0.5
  beta2: 0.999
  label_smoothing: true
  smooth_val: 0.9
  sample_interval: 5
  checkpoint_interval: 5
  mixed_precision: false
